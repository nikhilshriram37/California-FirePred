name: Backfill fire labels

# Closes the prediction -> outcome loop. Re-labels the trailing 10 days of
# feature_history from the fused fire sources (has_fire), and archives the raw FIRMS
# detections. The window catches late-arriving / corrected detections, and is wider
# than score_daily's catch-up window so a late-scored day is still labellable when it
# lands. This is the ground truth the retrain and the live scorecards consume.

on:
  schedule:
    # Twice daily, each slot trailing a scoring run (13:00 + 21:00 UTC). Two reasons.
    # Ordering: gridMET lags ~1 day, so the day the labeller wants is often not scored
    # until the evening run — a single 15:00 slot was labelling days that did not exist
    # yet. Reliability: FIRMS times out intermittently from Actions egress (observed
    # ~1 success in 3), and two independent attempts a day turn that into a near
    # certainty across the self-heal window.
    - cron: "0 15 * * *"   # 15:00 UTC — after the morning scoring run (13:00 UTC)
    - cron: "0 23 * * *"   # 23:00 UTC — after the evening scoring run (21:00 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "Trailing days to re-label"
        default: "10"

concurrency:
  group: backfill-labels
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install pandas numpy scikit-learn requests supabase python-dotenv
      - name: Backfill labels from FIRMS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: python -m src.pipeline.backfill_labels --days ${{ github.event.inputs.days || '10' }}

      # Same window as the labelling step, and deliberately after it: a scorecard is
      # only meaningful once that day's outcomes are known. Upserting the whole window
      # each run lets late-arriving detections correct earlier scorecards. Skipped
      # entirely if labelling failed, so metrics are never computed on bad labels.
      - name: Score model performance into model_metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.pipeline.metrics --days ${{ github.event.inputs.days || '10' }}
